<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EquiRoyme – Chevaux à vendre partout en France</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --paper:#f5f6f3; --card:#ffffff; --ink:#17212b; --muted:#5d6b66;
  --forest:#24473d; --brass:#b08d3c; --line:#dde2dc;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#12181a; --card:#1b2326; --ink:#eef1ee; --muted:#9fb0a9; --forest:#7fb6a2; --brass:#d5b25a; --line:#2c373a; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Instrument Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
header{padding:28px 20px 18px;max-width:1280px;margin:auto}
h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;margin:0 0 6px;color:var(--forest);letter-spacing:-.01em}
header p{margin:0;color:var(--muted);max-width:55ch}
.filters{max-width:1280px;margin:0 auto;padding:0 20px 16px;display:flex;flex-wrap:wrap;gap:10px}
.filters input,.filters select,.filters button{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.filters button{background:var(--forest);color:#fff;border-color:var(--forest);cursor:pointer;font-weight:600}
.filters button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.filters :focus-visible,.card:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
main{max-width:1280px;margin:auto;padding:0 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
#count{grid-column:1/-1;margin:0;color:var(--muted);font-size:.95rem}
#list{display:grid;gap:14px}
.card{display:grid;grid-template-columns:140px 1fr;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.card.sel{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
.photo{background:var(--line) center/cover no-repeat;min-height:120px;display:grid;place-items:center;color:var(--muted);font-size:2rem}
.info{padding:12px 14px}
.info h2{font-family:'Fraunces',Georgia,serif;font-size:1.2rem;margin:0}
.price{font-weight:600;color:var(--brass);font-size:1.1rem;margin:2px 0 6px}
.meta{color:var(--muted);font-size:.9rem}
.tag{display:inline-block;font-size:.8rem;padding:1px 8px;border-radius:99px;border:1px solid var(--line);margin-right:4px;margin-top:6px}
#map{height:calc(100vh - 40px);min-height:420px;position:sticky;top:20px;border-radius:12px;border:1px solid var(--line)}
.msg{padding:24px;background:var(--card);border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
.msg.err{border-color:#b3412e;color:#b3412e}
@media (max-width:820px){
  main{grid-template-columns:1fr}
  #map{position:static;height:340px;order:-1}
  .card{grid-template-columns:110px 1fr}
}
</style>
</head>
<body>
<header>
  <h1>EquiRoyme</h1>
  <p>Trouvez un cheval près de chez vous, partout en France.</p>
</header>

<form class="filters" id="filters" aria-label="Filtrer les annonces">
  <input id="f-dep" placeholder="Département (ex : 31)" inputmode="numeric" aria-label="Département">
  <select id="f-sexe" aria-label="Sexe">
    <option value="">Tous les sexes</option>
    <option value="jument">Jument</option>
    <option value="hongre">Hongre</option>
    <option value="etalon">Étalon</option>
  </select>
  <input id="f-prix" type="number" min="0" step="500" placeholder="Prix max (€)" aria-label="Prix maximum">
  <input id="f-disc" placeholder="Discipline (ex : CSO)" aria-label="Discipline">
  <button type="submit">Filtrer</button>
  <button type="button" class="ghost" id="reset">Réinitialiser</button>
</form>

<main>
  <p id="count" aria-live="polite">Chargement…</p>
  <section id="list" aria-label="Annonces"></section>
  <div id="map" role="region" aria-label="Carte des annonces"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ====== À REMPLIR : tes deux informations Supabase ====== */
const SUPABASE_URL = "COLLE_ICI_TON_URL";          // ex : https://abcdxyz.supabase.co
const SUPABASE_KEY = "COLLE_ICI_TA_CLE_ANON";      // clé « anon » ou « publishable » uniquement
/* ======================================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => n == null ? "Prix sur demande" : new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);

const map = L.map('map').setView([46.6, 2.4], 5.5);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© les contributeurs d’OpenStreetMap'}).addTo(map);
let markers = L.layerGroup().addTo(map);
const markerById = {};

if (SUPABASE_URL.startsWith("COLLE") || SUPABASE_KEY.startsWith("COLLE")) {
  $('count').textContent = "";
  $('list').innerHTML = '<div class="msg err">Il manque ton URL ou ta clé Supabase : ouvre index.html avec le Bloc-notes et remplace les deux lignes marquées « À REMPLIR ».</div>';
} else {
  var db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  load();
}

async function load(){
  let q = db.from('listings')
    .select('id,prix,ville,departement,lat,lng,horses!inner(nom,race,sexe,date_naissance,taille_cm,discipline,photos)')
    .eq('statut','active')
    .order('created_at',{ascending:false})
    .limit(200);

  const dep = $('f-dep').value.trim();
  const sexe = $('f-sexe').value;
  const prix = $('f-prix').value;
  const disc = $('f-disc').value.trim();
  if (dep) q = q.eq('departement', dep);
  if (prix) q = q.lte('prix', Number(prix));
  if (sexe) q = q.eq('horses.sexe', sexe);
  if (disc) q = q.ilike('horses.discipline', '%' + disc.replace(/[%,]/g,'') + '%');

  const { data, error } = await q;
  if (error) {
    $('count').textContent = "";
    $('list').innerHTML = '<div class="msg err">Impossible de charger les annonces : ' + esc(error.message) + '</div>';
    return;
  }
  render(data || []);
}

function age(d){
  if(!d) return "";
  const a = Math.floor((Date.now() - new Date(d)) / 31557600000);
  return a + (a > 1 ? " ans" : " an");
}

function render(rows){
  markers.clearLayers();
  Object.keys(markerById).forEach(k => delete markerById[k]);
  $('count').textContent = rows.length + (rows.length > 1 ? " annonces" : " annonce");

  if (!rows.length){
    $('list').innerHTML = '<div class="msg">Aucune annonce pour le moment. Modifie les filtres ou dépose la première annonce.</div>';
    return;
  }

  const pts = [];
  $('list').innerHTML = rows.map(r => {
    const h = r.horses || {};
    const photo = (h.photos && h.photos[0]) ? `style="background-image:url('${encodeURI(h.photos[0])}')"` : "";
    const bits = [h.race, age(h.date_naissance), h.taille_cm ? h.taille_cm + " cm" : ""].filter(Boolean).map(esc).join(" – ");
    return `<article class="card" tabindex="0" data-id="${esc(r.id)}">
      <div class="photo" ${photo}>${photo ? "" : "🐴"}</div>
      <div class="info">
        <h2>${esc(h.nom)}</h2>
        <div class="price">${eur(r.prix)}</div>
        <div class="meta">${bits}</div>
        <div class="meta">${esc(r.ville)}${r.departement ? " (" + esc(r.departement) + ")" : ""}</div>
        ${h.sexe ? `<span class="tag">${esc(h.sexe)}</span>` : ""}${h.discipline ? `<span class="tag">${esc(h.discipline)}</span>` : ""}
      </div></article>`;
  }).join("");

  rows.forEach(r => {
    if (r.lat == null || r.lng == null) return;
    const m = L.marker([r.lat, r.lng]).addTo(markers);
    m.bindPopup(`<strong>${esc(r.horses?.nom)}</strong><br>${eur(r.prix)}<br>${esc(r.ville)}`);
    m.on('click', () => select(r.id, false));
    markerById[r.id] = m;
    pts.push([r.lat, r.lng]);
  });
  if (pts.length) map.fitBounds(pts, {padding:[40,40], maxZoom:10});
}

function select(id, pan = true){
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c.dataset.id === id));
  const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if (card) card.scrollIntoView({block:'nearest', behavior:'smooth'});
  const m = markerById[id];
  if (m && pan){ map.setView(m.getLatLng(), Math.max(map.getZoom(), 9)); m.openPopup(); }
}

$('list').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) select(c.dataset.id); });
$('list').addEventListener('keydown', e => { if (e.key === 'Enter'){ const c = e.target.closest('.card'); if (c) select(c.dataset.id); } });
$('filters').addEventListener('submit', e => { e.preventDefault(); if (typeof db !== 'undefined') load(); });
$('reset').addEventListener('click', () => { $('filters').reset(); if (typeof db !== 'undefined') load(); });
</script>
</body>
</html>
