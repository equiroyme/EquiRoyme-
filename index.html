<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EquiRoyme</title>
<meta name="description" content="Plateforme de vente, hébergement et transport de chevaux en France">
<meta name="theme-color" content="#1E2430">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EquiRoyme">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--ink:#1E2430;--mute:#5E6470;--line:#E4E6EA;--line2:#C9CDD3;--soft:#F4F5F7;--soft2:#F1F2F4;--acc:#B4541F;--accSoft:#F6E6DC;--accInk:#8A3F14;--good:#1F5A3A;--goodSoft:#E1EFE6;--green:#2F6B4F;--map:#E9EFE4;--hay:#E3B341;--pen:#2A5BB8;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:#E9ECEF}
body{font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;position:relative;padding-bottom:84px;padding-top:env(safe-area-inset-top,0px)}
.pad{padding:16px 18px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em}
h2{font-size:18px;font-weight:800;margin:0}
h3{font-size:15px;font-weight:800;margin:0}
.mute{color:var(--mute)}.small{font-size:12px}.xs{font-size:11px}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column}.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}
.between{justify-content:space-between}.f1{flex:1;min-width:0}
.scrollx{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-weight:700;text-decoration:none}
.btn.dark{background:var(--ink)}.btn.line{background:#fff;color:var(--ink);border:1px solid var(--ink)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2)}.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}.btn.block{width:100%}.btn.ok{background:var(--green)}.btn.off{background:#E4E6EA;color:#3A404C}
.link{background:none;border:0;padding:0;min-height:40px;font-weight:700;text-decoration:underline;color:var(--ink)}
.chip{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:13px;font-weight:700;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:grid;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;border:0;background:#fff;font-size:13px;font-weight:700;padding:0 4px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.fld{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line2);border-radius:12px;padding:8px 12px;background:#fff}
.fld span{font-size:11px;font-weight:600;color:var(--mute)}
.fld input,.fld select,.fld textarea{border:0;outline:0;background:transparent;font-size:15px;font-weight:600;padding:0;width:100%}
.fld.soft{background:var(--soft);border-color:var(--soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--soft2);color:#3A404C}
.tag.acc{background:var(--accSoft);color:var(--accInk)}.tag.good{background:var(--goodSoft);color:var(--good)}.tag.warn{background:#FBEFD9;color:#7A4B0C}.tag.blue{background:#E6ECF7;color:#24406E}.tag.bad{background:#F7E3E3;color:#8A2424}.tag.hay{background:var(--hay);color:#2A2000}.tag.white{background:#fff;color:var(--ink)}
.ph{border-radius:14px;display:flex;align-items:center;justify-content:center;color:#5B5446;font-size:12px;font-weight:600;position:relative}
.switch{flex-shrink:0;width:52px;height:32px;border-radius:999px;border:0;padding:3px;display:flex;align-items:center;background:#767C86}
.switch::after{content:"";width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked=true]{background:var(--acc);justify-content:flex-end}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:76px;padding-bottom:env(safe-area-inset-bottom,0px);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));z-index:20}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--mute)}
.nav button[aria-current=page]{color:var(--acc);font-weight:800}
.nav svg{stroke:currentColor}
.badge{position:absolute;top:8px;margin-left:18px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
.icon{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon.soft{border:0;background:var(--soft2);width:40px;height:40px}
.overlay{position:fixed;inset:0;background:rgba(30,36,48,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92vh;background:#fff;border-radius:24px 24px 0 0;display:flex;flex-direction:column}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.sheet .bd{overflow-y:auto;padding:18px 20px 22px;display:flex;flex-direction:column;gap:20px}
.sheet .bd>*{flex-shrink:0}
.sheet .ft{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.search{flex:1;display:flex;align-items:center;gap:12px;background:#fff;border:0;border-radius:999px;padding:11px 18px;box-shadow:0 4px 18px rgba(30,36,48,.16);text-align:left}
.mapbox{position:relative;background:var(--map);border-radius:0 0 22px 22px;overflow:hidden}
.mapbox svg.fr{display:block;width:100%;height:auto;margin:0 auto}
.pin{cursor:pointer}
.floating{position:absolute;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(30,36,48,.25)}
.bigbtn{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border-radius:16px;border:1px solid var(--line);background:#fff;text-align:left;width:100%}
.bigbtn .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--acc)}
.bigbtn.acc{background:var(--acc);border-color:var(--acc);color:#fff}.bigbtn.acc .ic{background:rgba(255,255,255,.18)}
.hcard{flex:0 0 200px;display:flex;flex-direction:column;gap:3px;border:0;background:none;padding:0;text-align:left}
.heart{position:absolute;right:2px;top:2px;width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center}
.bubble{max-width:80%;border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.45}
.bubble.me{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble.sys{align-self:center;background:var(--soft2);color:#3A404C;font-size:12px;font-weight:600;border-radius:999px;padding:6px 12px}
.listrow{display:flex;align-items:center;justify-content:space-between;min-height:52px;border:0;border-bottom:1px solid var(--soft2);background:none;padding:0;font-size:15px;font-weight:600;width:100%;text-align:left;text-decoration:none}
.empty{border:1.5px dashed var(--line2);border-radius:14px;padding:22px;text-align:center;color:var(--mute);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:60;max-width:440px;width:calc(100% - 32px);text-align:center}
.bottombar{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;z-index:15}
.note{font-size:12px;color:var(--mute);line-height:1.45}
#lmap{position:relative;z-index:0;width:100%;background:#E9EFE4}
.lpin{background:none;border:0}
.mk{display:block;box-sizing:border-box;width:18px;height:18px;border-radius:50%;background:#1E2430;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer}
.mk.sp{width:24px;height:24px;border-color:#B4541F}.mk.loc{background:#E3B341}
.mk.near{width:22px;height:22px;background:#fff;border:3px solid #B4541F}
.mk.sq{border-radius:5px;background:#2F6B4F;width:20px;height:20px}
.mk.start{border-radius:3px;transform:rotate(45deg);width:18px;height:18px}
.mk.end{background:#B4541F;width:20px;height:20px}
.mk.num,.mk.off{width:28px;height:28px;color:#fff;font:800 13px/22px "Plus Jakarta Sans",sans-serif;text-align:center;background:#B4541F}
.mk.off{background:#2A5BB8;width:26px;height:26px;line-height:20px;font-size:12px}
.leaflet-control-attribution{font-size:10px}
</style>
</head>
