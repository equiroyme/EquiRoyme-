/* ---------- Filtres & résultats ---------- */
function fCount(){var f=S.f,n=0;["cat","race","sexe","deb","epr","ageMin","ageMax","taille","prixMin","prixMax","ray"].forEach(function(k){if(f[k]!=="")n++});n+=f.disc.length;if(f.type!=="vente")n++;return n}
function matches(h){var f=S.f;
 if(f.type==="vente"&&h.loc)return false;if(f.type==="location"&&!h.loc)return false;
 if(f.cat&&h.cat!==f.cat)return false;if(f.disc.length&&f.disc.indexOf(h.disc)<0)return false;if(f.race&&h.race!==f.race)return false;
 if(f.sexe&&h.sexe!==f.sexe)return false;if(f.deb!==""&&h.deb!==+f.deb)return false;
 if(f.epr){var o=["Club","Amateur","Pro"];if(o.indexOf(h.epr)>o.indexOf(f.epr))return false}
 if(f.ageMin!==""&&!(h.age>=+f.ageMin))return false;if(f.ageMax!==""&&!(h.age<=+f.ageMax))return false;
 if(f.taille){var t=f.taille.split("-");if(!(h.taille>=+t[0]&&h.taille<=+t[1]))return false}
 if(f.prixMin!==""&&!(h.prix>=+f.prixMin))return false;if(f.prixMax!==""&&!(h.prix<=+f.prixMax))return false;
 if(f.ray!==""&&origin()){var d=dist(h);if(d==null||d>+f.ray)return false}
 if(S.route&&!onRoute(h))return false;
 return true}
function km2(c,lat0){return[c[1]*111.32*Math.cos(lat0*Math.PI/180),c[0]*110.57]}
function segDist(p,a,b){var l=(a[0]+b[0])/2,P=km2(p,l),A1=km2(a,l),B=km2(b,l),dx=B[0]-A1[0],dy=B[1]-A1[1],L=dx*dx+dy*dy,t=L?Math.max(0,Math.min(1,((P[0]-A1[0])*dx+(P[1]-A1[1])*dy)/L)):0,x=A1[0]+t*dx-P[0],y=A1[1]+t*dy-P[1];return Math.sqrt(x*x+y*y)}
function routePts(){if(!S.route)return null;var a=S.route.from==="__geo"?S.geo:CITIES[S.route.from],b=CITIES[S.route.to];return a&&b?[a,b]:null}
function detour(){return S.route&&S.route.detour!==""?+S.route.detour:20}
function onRoute(h){var r=routePts();if(!r||!COORD[h.id])return false;return segDist(COORD[h.id],r[0],r[1])<=detour()}
function results(){var r=H.filter(matches);var s=S.sort;
 r.sort(function(a,b){if(s==="dist"){var da=dist(a),db=dist(b);return(da==null?1e9:da)-(db==null?1e9:db)}if(s==="pasc")return(a.prix||0)-(b.prix||0);if(s==="pdesc")return(b.prix||0)-(a.prix||0);if(s==="new")return b.id-a.id;return(b.sp-a.sp)||(a.id-b.id)});return r}

  results().forEach(function(h){if(!COORD[h.id])return;var q=xy(COORD[h.id]),big=h.sp?12:9;g+='<g class="pin" tabindex="0" role="button" aria-label="'+esc(h.nom)+', '+price(h)+', '+esc(h.ville)+'"'+A("horse",h.id)+'><circle cx="'+q[0]+'" cy="'+q[1]+'" r="20" fill="transparent"/><circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+big+'" fill="'+(h.loc?"#E3B341":"#1E2430")+'" stroke="'+(h.sp?"#B4541F":"#fff")+'" stroke-width="3"/></g>'});
  S.f.type=keepT}
 return franceSvg(g,"Carte des annonces et écuries étapes",400)}
